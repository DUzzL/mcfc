plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
    id 'com.google.devtools.ksp' version "2.1.0-1.0.29"
    id 'dev.epicpix.java-class-downgrader' version '1.0-SNAPSHOT'
}

group = "dev.epicpix"
version = project.mod_version

apply plugin: 'com.google.devtools.ksp'
apply plugin: 'dev.epicpix.java-class-downgrader'

repositories {
    mavenCentral()
    maven { url = uri("https://maven.fabricmc.net/") }
    maven { url = uri("https://libraries.minecraft.net/") }
    maven { url = uri("https://jitpack.io") }
}

dependencies {
    implementation(project(":annotation-processor"))
    implementation("org.ow2.asm:asm:9.5")
    implementation("com.google.code.gson:gson:2.10.1")
    implementation("org.slf4j:slf4j-api:2.0.1")
    implementation("it.unimi.dsi:fastutil:8.5.9")
    ksp project(":annotation-processor")
}

project.ext.isJarTask = false

gradle.taskGraph.whenReady { taskExecutionGraph ->
    ksp {
        arg("isJarTask", taskExecutionGraph.hasTask(':jar').toString())
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.targetCompatibility = "21"
    it.sourceCompatibility = "21"
}

ksp {
    arg("data_dir", file("../data/").absolutePath)
    arg("definitions", "common")
    arg("version", project.mod_version)
    if("true" == System.getenv("CI")) {
        arg("commit", System.getenv("CI_COMMIT_SHA"))
    }
}

classDowngrader {
    it.targetJavaVersion = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(21)
}