plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.21'
    id 'com.google.devtools.ksp' version "1.9.21-1.0.16"
}

group = "dev.epicpix"
version = project.mod_version

apply plugin: 'com.google.devtools.ksp'

repositories {
    mavenCentral()
    maven { url = uri("https://maven.fabricmc.net/") }
    maven { url = uri("https://libraries.minecraft.net/") }
    maven { url = uri("https://jitpack.io") }
}

dependencies {
    implementation(project(":annotation-processor"))
    implementation("org.ow2.asm:asm:9.6")
    implementation("com.google.code.gson:gson:2.10.1")
    ksp project(":annotation-processor")
}

project.ext.isJarTask = false

gradle.taskGraph.whenReady { taskExecutionGraph ->
    ksp {
        arg("isJarTask", taskExecutionGraph.hasTask(':jar').toString())
    }
}

ksp {
    arg("definitions", "common")
    arg("version", project.mod_version)
    if("true" == System.getenv("CI")) {
        arg("commit", System.getenv("CI_COMMIT_SHA"))
    }
}

kotlin {
    jvmToolchain(17)
}