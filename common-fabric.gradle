version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

repositories {
    mavenCentral()
}

apply plugin: 'com.google.devtools.ksp'

dependencies {
    implementation(project(":annotation-processor"))
    implementation(project(":common"))
    implementation(project(":common-commands"))
    ksp project(":annotation-processor")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.10.10+kotlin.1.9.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

project.ext.isJarTask = false

gradle.taskGraph.whenReady { taskExecutionGraph ->
    ksp {
        arg("isJarTask", (taskExecutionGraph.hasTask(':jar') || taskExecutionGraph.hasTask(":${project.name}:proguard")).toString())
    }
}

ksp {
    arg("definitions", "minecraft")
    project.afterEvaluate {
        arg("mappingsFile", loom.mappingsFile.absolutePath)
    }
    arg("minecraft_version", project.minecraft_version)
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/.accesswidener")
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_kotlin_version", project.fabric_kotlin_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_kotlin_version": project.fabric_kotlin_version
    }
}

compileKotlin {
    dependsOn(':common:kspKotlin')
    dependsOn(':common-commands:kspKotlin')
}

jar {
    from project(':common').sourceSets.main.output
    from project(':common-commands').sourceSets.main.output
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

kotlin {
    jvmToolchain(17)
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.2.0'
    }
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
    forceprocessing
    verbose
    injars "build/libs/mcfc-" + version + ".jar"
    outjars "build/libs/mcfc-" + version + "-proguard.jar"

    libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
    libraryjars "${System.getProperty('java.home')}/jmods/java.net.http.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
    var files = new ArrayList<>(configurations.findByName('runtimeClasspath').getFiles())
    files.removeIf { it.getName().endsWith(project.mod_version + ".jar") }
    libraryjars files, jarfilter: '!**.jar', filter: '!module-info.class'

    dontobfuscate
    dontwarn

    keepattributes "Signature"

    keep allowoptimization: true, 'public class **'
    keep includecode: false, 'public class dev.epicpix.minecraftfunctioncompiler.mixin.** { \
    public protected private *; \
    }'
}

tasks.named("proguard") {
    dependsOn("build")
}