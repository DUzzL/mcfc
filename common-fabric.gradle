version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
}

apply plugin: 'com.google.devtools.ksp'

if(project.hasProperty("fabric_api_version")) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "minecraftfunctioncompiler-test"
            enableGameTests = true
            enableClientGameTests = false
            eula = true
        }
    }
}

dependencies {
    implementation(project(":annotation-processor"))
    implementation(project(":common"))
    ksp project(":annotation-processor")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    gametestImplementation(project(":common-test"))
    if(project.hasProperty("fabric_api_version")) {
        gametestImplementation fabricApi.module("fabric-gametest-api-v1", project.property("fabric_api_version"))
        gametestImplementation fabricApi.module("fabric-registry-sync-v0", project.property("fabric_api_version"))
    }
}

project.ext.isJarTask = false

gradle.taskGraph.whenReady { taskExecutionGraph ->
    ksp {
        arg("isJarTask", taskExecutionGraph.hasTask(':jar').toString())
    }
}

ksp {
    arg("definitions", "minecraft")
    arg("data_dir", file("../data/").absolutePath)
    project.afterEvaluate {
        arg("jars", project.configurations.runtimeClasspath.incoming.files.join(File.pathSeparator))
    }
    arg("minecraft_version", project.minecraft_version)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.targetCompatibility = "25"
    it.sourceCompatibility = "25"
}

java {
    base.archivesName = project.archives_base_name
    // broken: https://github.com/eclipse-jdt/eclipse.jdt.core/issues/4789
//    withSourcesJar()
//    tasks.named("sourcesJar") {
//        from project(':common').sourceSets.main.java
//        from project(':common').sourceSets.main.resources
//    }
}

loom {
    accessWidenerPath = file("src/main/resources/minecraftfunctioncompiler.classtweaker")
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

jar {
    from project(':common').sourceSets.main.output
    from("../LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
    exclude "dev/epicpix/minecraftfunctioncompiler/data/locations/**"
}

kotlin {
    jvmToolchain(25)
}
