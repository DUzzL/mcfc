version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
}

apply plugin: 'com.google.devtools.ksp'

dependencies {
    implementation(project(":annotation-processor"))
    implementation(project(":common"))
    ksp project(":annotation-processor")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

project.ext.isJarTask = false

gradle.taskGraph.whenReady { taskExecutionGraph ->
    ksp {
        arg("isJarTask", taskExecutionGraph.hasTask(':jar').toString())
    }
}

ksp {
    arg("definitions", "minecraft")
    arg("data_dir", file("../data/").absolutePath)
    project.afterEvaluate {
        arg("mappingsFile", loom.mappingsFile.absolutePath)
        arg("jars", project.configurations.runtimeClasspath.incoming.files.join(File.pathSeparator))
    }
    arg("minecraft_version", project.minecraft_version)
    arg("accesswidener", file("src/main/resources/minecraftfunctioncompiler.v${project.minecraft_version.replaceAll("\\.", "_")}.accesswidener").absolutePath)
}

def targetJavaVersion = project.ext.java_version
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.targetCompatibility = "21"
    it.sourceCompatibility = "21"
}

java {
    base.archivesName = project.archives_base_name
    withSourcesJar()

    tasks.named("sourcesJar") {
        from project(':common').sourceSets.main.java
        from project(':common').sourceSets.main.resources
    }
}

loom {
    accessWidenerPath = file("src/main/resources/minecraftfunctioncompiler.v${project.minecraft_version.replaceAll("\\.", "_")}.accesswidener")
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

compileJava {
    dependsOn(':common:kspKotlin')
}

jar {
    from project(':common').sourceSets.main.output
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    exclude("minecraftfunctioncompiler.v${project.minecraft_version.replaceAll("\\.", "_")}.generated.accesswidener")
}

kotlin {
    jvmToolchain(21)
}
