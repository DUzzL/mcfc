pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
        id 'com.google.devtools.ksp' version "1.9.21-1.0.16"
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include 'annotation-processor'
include 'mc-combined-fabric-java17'
include 'mc-1-20-6-fabric'
include 'mc-1-20-4-fabric'
include 'mc-1-20-2-fabric'
include 'mc-1-20-1-fabric'
include 'common'
