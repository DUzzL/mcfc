plugins {
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '1.9.21'
}

version = "${project.mod_version}-fabric"
group = project.maven_group

def modVersions = ["1.20.1", "1.20.2", "1.20.4"]

repositories {
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
    maven { url = uri("https://libraries.minecraft.net/") }
    maven { url = uri("https://maven.fabricmc.net/") }
}

dependencies {
    implementation project(":common")
    modVersions.forEach { ver ->
        implementation project(":mc-${ver.replace('.', '-')}-fabric")
    }

    implementation "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"
    implementation "net.fabricmc:fabric-loader:0.15.11"
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
}

compileJava {
    modVersions.forEach { ver ->
        dependsOn(":mc-${ver.replace('.', '-')}-fabric:build")
    }
}

jar {
    from(project(':common').sourceSets.main.output)
    modVersions.forEach { ver ->
        from(project(":mc-${ver.replace('.', '-')}-fabric").sourceSets.main.output) {
            exclude("mcfc-refmap.json")
            exclude("META-INF/mcfc.kotlin_module")
            exclude("fabric.mod.json")
            rename("minecraftfunctioncompiler.v${ver.replace('.', '_')}.generated.accesswidener", "minecraftfunctioncompiler.v${ver.replace('.', '_')}.accesswidener")
            exclude("minecraftfunctioncompiler.v${ver.replace('.', '_')}.accesswidener")
        }
    }
    from(project(':mc-combined-fabric').sourceSets.main.output)
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}
