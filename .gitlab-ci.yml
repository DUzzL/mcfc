image: openjdk:17-jdk-oraclelinux7

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

build:
  stage: build
  script: ./gradlew proguard
  after_script:
    - mv $(find -name "mcfc-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar") ./
  artifacts:
    paths:
      - ./mcfc-*.jar
