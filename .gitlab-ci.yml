image: eclipse-temurin:25.0.1_8-jdk

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

build:
  stage: build
  script: ./gradlew build --stacktrace
  after_script:
    - mv $(find -name "mcfc-*.jar" ! -wholename "*devlibs/*") ./
  artifacts:
    paths:
      - ./mcfc-*.jar
