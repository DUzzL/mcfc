image: amazoncorretto:21.0.3-al2023-headless

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

build:
  stage: build
  script: ./gradlew build
  after_script:
    - mv $(find -name "mcfc-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar") ./
  artifacts:
    paths:
      - ./mcfc-*.jar
